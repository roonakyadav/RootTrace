name: roottrace
version: "1.0.0"
description: >
  Causal incident environment for evaluating AI agents on distributed-system
  diagnosis, recovery, and operational decision-making.
tags:
  - ai-agents
  - incident-response
  - sre
  - devops
  - agent-evaluation
  - multi-step-reasoning

tasks:
  - id: easy-auth-down
    difficulty: easy
    max_steps: 5
    success_threshold: 0.6
    description: Single auth service failure. Restart the correct service.

  - id: medium-payments-degraded
    difficulty: medium
    max_steps: 8
    success_threshold: 0.6
    description: Payments service degraded under high load. Scale and stabilize.

  - id: hard-bad-deployment
    difficulty: hard
    max_steps: 10
    success_threshold: 0.6
    description: Misleading database evidence hides a faulty auth deployment.

  - id: hard-cascading-failure
    difficulty: hard
    max_steps: 10
    success_threshold: 0.6
    description: Database degradation causes failures to propagate downstream.

  - id: hard-cascading-ambiguous
    difficulty: hard
    max_steps: 15
    success_threshold: 0.6
    description: Shared dependency failure requires correct diagnosis and action ordering.

  - id: hard-latent-root-cause
    difficulty: hard
    max_steps: 12
    success_threshold: 0.6
    description: A latent payments issue presents as an auth failure.

action_space:
  type: structured
  schema:
    action_type: string
    target: string (optional)
  actions:
    - restart_service
    - rollback_service
    - isolate_service
    - check_logs
    - check_metrics
    - scale
    - drain_traffic
    - restore_traffic
    - optimize_db
    - escalate
    - ignore

observation_space:
  - services: list of service state objects
  - logs: list of recent log strings
  - alerts: list of active alert strings
  - system_health: float [0.0, 1.0]
  - system_stability: float [0.0, 1.0]
  - system_strain: float [0.0, 1.0]
  - time_step: integer
  - diagnosed_targets: list of services

endpoints:
  reset: POST /reset
  step: POST /step
  state: GET /state
  health: GET /health
