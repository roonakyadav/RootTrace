[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roottrace"
version = "1.0.0"
description = "Causal incident environments for evaluating AI agents"
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.0",
    "fastapi",
    "uvicorn",
    "pydantic",
    "openai",
    "requests",
    "pyyaml",
    "python-dotenv",
]

[project.scripts]
roottrace = "cli:main"
roottrace-server = "api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "api*", "env*", "evaluation*", "models*"]

[tool.setuptools]
py-modules = ["cli", "inference"]
